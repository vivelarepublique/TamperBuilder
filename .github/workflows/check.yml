name: Check

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version:
                    - 22.22.2
                    - 24.15.0
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm
            - run: npm install --global npm@11.19.0
            - run: npm ci
            - run: npm run check
